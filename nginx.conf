server {
    listen 80;
    root /usr/share/nginx/html;

    # No publicar la version de nginx.
    server_tokens off;

    # Compresion de texto (el paquete inicial de JavaScript y CSS pesa varios cientos de kB).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad. No se agrega Content-Security-Policy: una politica mal ajustada
    # rompe la aplicacion (Google Identity Services, estilos en linea) y no se probo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
