<app-page-header
  title="Promociones"
  subtitle="Descuentos para todos los productos, por categoría o por productos elegidos. Hacé clic en una promoción para editarla."
  [crumbs]="crumbs"
>
  <button type="button" class="btn btn-primary" (click)="openCreate()">
    <app-icon name="plus" />
    Nueva promoción
  </button>
</app-page-header>

<div class="mb-4 flex flex-wrap items-center gap-2.5">
  <label
    class="flex h-10 min-w-0 flex-[1_1_16rem] items-center gap-2 rounded-field border border-base-300 bg-base-100 px-3 text-base-content/60"
  >
    <app-icon name="search" />
    <input
      #search
      type="search"
      class="min-w-0 flex-1 bg-transparent text-sm text-base-content outline-none"
      placeholder="Buscar por nombre o descripción"
      aria-label="Buscar promoción"
      (input)="term.set(search.value)"
    />
  </label>
  <div role="group" aria-label="Estado de la promoción" class="inline-flex flex-wrap gap-0.5 rounded-[10px] bg-base-200 p-[3px]">
    @for (option of segments; track option.value) {
      <button
        type="button"
        class="rounded-lg px-3 py-1.5 text-[0.8125rem] font-medium text-base-content/65"
        [class.bg-base-100]="segment() === option.value"
        [class.text-base-content]="segment() === option.value"
        [class.font-semibold]="segment() === option.value"
        [class.shadow-sm]="segment() === option.value"
        [attr.aria-pressed]="segment() === option.value"
        (click)="segment.set(option.value)"
      >
        {{ option.label }}
        <span class="opacity-60">{{ counts()[option.value] }}</span>
      </button>
    }
  </div>
</div>

<app-resource-state
  [loading]="list.isLoading() && listItems().length === 0"
  [failed]="!!list.error()"
  [empty]="listItems().length === 0"
  emptyTitle="Sin promociones"
  emptyDescription="Creá una promoción para aplicar descuentos automáticos en el catálogo."
  (retry)="reload()"
>
  <section aria-label="Lista de promociones" class="overflow-hidden rounded-box border border-base-300 bg-base-100">
    <div
      class="list-row grid-cols-[minmax(0,2.2fr)_8rem_13rem_5rem_7.5rem_1rem] border-t-0 py-3.5 max-md:hidden hover:bg-transparent"
    >
      <span class="list-th">Promoción</span>
      <span class="list-th text-end">Descuento</span>
      <span class="list-th">Vigencia</span>
      <span class="list-th text-end">Prioridad</span>
      <span class="list-th">Estado</span>
      <span></span>
    </div>

    @for (promotion of items(); track promotion.id) {
      <button
        type="button"
        class="list-row w-full cursor-pointer grid-cols-[minmax(0,2.2fr)_8rem_13rem_5rem_7.5rem_1rem] text-start max-md:grid-cols-2 max-md:gap-y-2"
        [attr.aria-label]="'Editar ' + promotion.nombre"
        (click)="openEdit(promotion)"
      >
        <span class="flex min-w-0 flex-col">
          <span class="truncate font-semibold">{{ promotion.nombre }}</span>
          <span class="truncate text-xs text-base-content/60" [attr.title]="scopeOf(promotion)">{{ scopeOf(promotion) }}</span>
        </span>
        <span class="font-semibold tabular-nums md:text-end">
          @if (isPercentage(promotion)) {
            {{ promotion.valorDescuento | number: '1.0-2' }} %
          } @else {
            {{ promotion.valorDescuento | money }} c/u
          }
        </span>
        <span class="text-sm text-base-content/75">{{ vigenciaOf(promotion) }}</span>
        <span class="tabular-nums max-md:hidden md:text-end">{{ promotion.prioridad }}</span>
        <app-status-chip [label]="statusLabel(promotion)" [tone]="statusTone(promotion)" />
        <app-icon name="chevron" class="text-base-content/40 max-md:hidden" />
      </button>
    } @empty {
      <p class="border-t border-base-300 px-5 py-8 text-center text-sm text-base-content/60">
        Ninguna promoción coincide con la búsqueda.
      </p>
    }

    <div class="border-t border-base-300 px-5 py-3 text-xs text-base-content/60">
      {{ items().length }} de {{ listItems().length }} promociones
    </div>
  </section>
</app-resource-state>

@if (formOpen()) {
  <app-promotion-form
    [promotion]="editing()"
    (saved)="onSaved()"
    (cancelled)="closeForm()"
    (removeRequested)="askDelete($event)"
  />
}

<app-confirm-dialog
  [open]="deleting() !== null"
  title="¿Eliminar promoción?"
  [message]="deleteMessage()"
  confirmLabel="Eliminar"
  tone="danger"
  [busy]="deleteBusy()"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
/>
