<app-page-header
  title="Panel"
  [subtitle]="'Resumen de la jornada · ' + (auth.user()?.name ?? '')"
  [crumbs]="crumbs"
>
  <app-branch-scope-picker />
  <button type="button" class="btn btn-sm sm:btn-md" [disabled]="loading()" (click)="reload()">
    Actualizar
  </button>
</app-page-header>

<section class="grid grid-cols-2 gap-3 sm:gap-4 xl:grid-cols-4" [attr.aria-busy]="loading()">
  <app-stat-card label="Ventas de mostrador hoy" [value]="(cutValue()?.total ?? 0) | money" />
  <app-stat-card label="Tickets de hoy" [value]="cutValue()?.cantidadVentas ?? 0" />
  <app-stat-card label="Pedidos en línea por atender" [value]="pendingOrders()" hint="Pendientes, en preparación o listos" />
  <app-stat-card
    label="Insumos en mínimo"
    [value]="lowStock()"
    [hint]="'Requieren reposición · ' + (scope.isAll() ? 'todas las sucursales' : scope.label())"
  />
</section>

<h2 class="mt-6 mb-2 font-sans text-[0.68rem] font-semibold uppercase tracking-[0.09em] text-base-content/55 sm:mt-8 sm:mb-3">Accesos rápidos</h2>
<section
  class="grid overflow-hidden rounded-box border border-base-300 bg-base-100 sm:grid-cols-3 sm:gap-4 sm:overflow-visible sm:border-0 sm:bg-transparent"
  aria-label="Accesos rápidos"
>
  <a
    routerLink="/backoffice/pos"
    class="flex items-center gap-3 border-base-300 bg-base-100 px-4 py-3 transition-colors not-first:border-t hover:bg-base-200 sm:gap-4 sm:rounded-box sm:border sm:p-5 sm:not-first:border-t"
  >
    <span class="grid size-9 shrink-0 place-items-center rounded-field bg-primary/10 text-primary sm:size-10">
      <app-icon name="pos" />
    </span>
    <span class="min-w-0 flex-1">
      <span class="block text-sm font-semibold sm:text-base">Abrir punto de venta</span>
      <span class="mt-0.5 block text-xs text-base-content/60 sm:text-sm">Registrar una venta en mostrador.</span>
    </span>
    <app-icon name="chevron" class="text-base-content/40" />
  </a>
  <a
    routerLink="/backoffice/raw-materials"
    class="flex items-center gap-3 border-base-300 bg-base-100 px-4 py-3 transition-colors not-first:border-t hover:bg-base-200 sm:gap-4 sm:rounded-box sm:border sm:p-5 sm:not-first:border-t"
  >
    <span class="grid size-9 shrink-0 place-items-center rounded-field bg-primary/10 text-primary sm:size-10">
      <app-icon name="sack" />
    </span>
    <span class="min-w-0 flex-1">
      <span class="block text-sm font-semibold sm:text-base">Revisar inventario</span>
      <span class="mt-0.5 block text-xs text-base-content/60 sm:text-sm">Existencias y niveles de reposición.</span>
    </span>
    <app-icon name="chevron" class="text-base-content/40" />
  </a>
  <a
    routerLink="/backoffice/users"
    class="flex items-center gap-3 border-base-300 bg-base-100 px-4 py-3 transition-colors not-first:border-t hover:bg-base-200 sm:gap-4 sm:rounded-box sm:border sm:p-5 sm:not-first:border-t"
  >
    <span class="grid size-9 shrink-0 place-items-center rounded-field bg-primary/10 text-primary sm:size-10">
      <app-icon name="users" />
    </span>
    <span class="min-w-0 flex-1">
      <span class="block text-sm font-semibold sm:text-base">Usuarios y roles</span>
      <span class="mt-0.5 block text-xs text-base-content/60 sm:text-sm">Asignar roles y activar cuentas.</span>
    </span>
    <app-icon name="chevron" class="text-base-content/40" />
  </a>
</section>
