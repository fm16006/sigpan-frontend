<app-auth-layout
  title="Crear cuenta"
  subtitle="Para hacer pedidos y seguir su preparación."
>
  <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
    @if (errorMessage()) {
      <div role="alert" class="alert alert-error py-2 text-sm">{{ errorMessage() }}</div>
    }

    <div>
      <label class="label" for="name"><span class="label-text">Nombre</span></label>
      <input
        id="name"
        type="text"
        formControlName="name"
        autocomplete="name"
        class="input input-bordered w-full"
        [class.input-error]="!!errorFor('name')"
      />
      @if (errorFor('name'); as message) {
        <p class="mt-1 text-xs text-error">{{ message }}</p>
      }
    </div>

    <div>
      <label class="label" for="email"><span class="label-text">Correo electrónico</span></label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        class="input input-bordered w-full"
        [class.input-error]="!!errorFor('email')"
      />
      @if (errorFor('email'); as message) {
        <p class="mt-1 text-xs text-error">{{ message }}</p>
      }
    </div>

    <div>
      <label class="label" for="password"><span class="label-text">Contraseña</span></label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        class="input input-bordered w-full"
        [class.input-error]="!!errorFor('password')"
      />
      @if (errorFor('password'); as message) {
        <p class="mt-1 text-xs text-error">{{ message }}</p>
      } @else {
        <p class="mt-1 text-xs text-base-content/50">Mínimo {{ minLength }} caracteres.</p>
      }
    </div>

    <button type="submit" class="btn btn-primary mt-2" [disabled]="submitting()">
      @if (submitting()) {
        <span class="loading loading-spinner loading-sm"></span>
      }
      Crear cuenta
    </button>
  </form>

  <ng-container authFooter>
    ¿Ya tenés cuenta?
    <a routerLink="/auth/login" class="link link-primary">Iniciá sesión</a>
  </ng-container>
</app-auth-layout>
