<aside class="flex w-56 shrink-0 flex-col border-e border-base-300 bg-base-100 xl:w-64">
  <div class="flex h-16 items-center border-b border-base-300 px-4">
    <app-brand-mark [size]="1.75" label="SigPan" labelClass="text-base" />
  </div>

  <nav class="flex flex-1 flex-col gap-1 p-3" aria-label="Administración">
    @for (item of menu.items(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-base-200 font-medium text-base-content"
        [routerLinkActiveOptions]="{ exact: item.path === '/backoffice' }"
        class="rounded-field px-3 py-2 text-sm text-base-content/70 hover:bg-base-200"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  @if (menu.showStore()) {
    <div class="border-t border-base-300 p-3">
      <a routerLink="/" class="btn btn-ghost btn-sm w-full justify-start">Ver tienda</a>
    </div>
  }
</aside>
