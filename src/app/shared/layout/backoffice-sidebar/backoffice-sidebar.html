<aside class="flex w-60 shrink-0 flex-col border-e border-base-300 bg-base-100">
  <div class="flex h-16 items-center border-b border-base-300 px-4">
    <app-brand-mark [size]="1.75" label="SigPan" labelClass="text-base" />
  </div>

  <nav class="flex flex-1 flex-col gap-5 overflow-y-auto px-3 py-4" aria-label="Administración">
    @for (group of menu.groups(); track group.label) {
      <div class="flex flex-col gap-0.5">
        <span
          class="px-3 pb-1 text-[0.68rem] font-semibold uppercase tracking-[0.09em] text-base-content/55"
        >
          {{ group.label }}
        </span>
        @for (item of group.items; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-primary/10 font-semibold text-primary"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            class="flex items-center gap-2.5 rounded-field px-3 py-2 text-sm text-base-content/80 hover:bg-base-200 hover:text-base-content"
          >
            <app-icon [name]="item.icon" [size]="17" />
            {{ item.label }}
          </a>
        }
      </div>
    }
  </nav>

  @if (menu.showStore()) {
    <div class="border-t border-base-300 p-3">
      <a routerLink="/" class="btn btn-ghost btn-sm w-full justify-start">Ver tienda</a>
    </div>
  }
</aside>
