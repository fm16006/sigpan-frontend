<header
  class="flex h-16 items-center gap-2 border-b border-base-300 bg-base-100 px-4 sm:gap-3 lg:px-8"
>
  <!-- En pantallas chicas la barra lateral se abre como panel deslizable, con los mismos grupos. -->
  <button
    type="button"
    class="btn btn-ghost btn-sm btn-circle lg:hidden"
    aria-label="Abrir menú"
    aria-controls="menu-movil"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(true)"
  >
    <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  </button>

  @if (menuOpen()) {
    <div class="fixed inset-0 z-50 flex lg:hidden">
      <button
        type="button"
        class="absolute inset-0 cursor-default bg-neutral/45"
        aria-label="Cerrar menú"
        tabindex="-1"
        (click)="menuOpen.set(false)"
      ></button>
      <div
        id="menu-movil"
        role="dialog"
        aria-modal="true"
        aria-label="Menú del panel"
        class="relative flex h-full max-w-[85vw] shadow-xl"
      >
        <app-backoffice-sidebar class="flex h-full" />
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-circle absolute end-2 top-3"
          aria-label="Cerrar menú"
          (click)="menuOpen.set(false)"
        >
          <app-icon name="close" />
        </button>
      </div>
    </div>
  }

  <span class="truncate font-medium text-base-content">Panel administrativo</span>
  @if (roleLabel()) {
    <span class="badge badge-ghost badge-sm hidden sm:inline-flex">{{ roleLabel() }}</span>
  }
  @if (kiosk()) {
    <span class="badge badge-outline badge-sm">Modo quiosco</span>
  }

  <div class="ms-auto flex items-center gap-2 sm:gap-3">
    <app-theme-toggle />

    @if (auth.user(); as user) {
      <span class="hidden text-sm text-base-content/70 lg:inline">{{ user.email }}</span>
      <button type="button" class="btn btn-outline btn-sm" (click)="auth.logout()">
        <span class="hidden sm:inline">Cerrar sesión</span>
        <span class="sm:hidden" aria-hidden="true">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              d="M15 17l5-5-5-5M20 12H9M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>
    }
  </div>
</header>
